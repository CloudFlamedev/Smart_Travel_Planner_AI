apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smart-travel-planner
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build with --build-arg VITE_API_URL=/api so it stays same-origin
          # behind the ingress, matching how it's set up on Vercel.
          image: <ECR_FRONTEND_REPO_URL>:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
